---
# cPanel Git Version Control deployment file.
# Replace REPLACE_USERNAME with your cPanel username before cPanel Git deploys.
# Also verify the NODE path matches the Node.js binary on your cPanel host.
# If your cPanel does not have Node.js support, see the local-build alternative in DEPLOY-CPANEL.md.
deployment:
  tasks:
    - export DEPLOYPATH=/home/REPLACE_USERNAME/ehub-app
    - export NODE=/opt/cpanel/ea-nodejs20/bin/npm
    - /bin/rm -rf $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R . $DEPLOYPATH
    - cd $DEPLOYPATH
    - $NODE install
    - $NODE run build:cpanel
