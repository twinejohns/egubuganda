---
# cPanel Git Version Control deployment file.
# Replace REPLACE_USERNAME with your cPanel username before cPanel Git deploys.
# If your cPanel does not have Node.js support, use the local build path in DEPLOY-CPANEL.md instead.
deployment:
  tasks:
    - export DEPLOYPATH=/home/REPLACE_USERNAME/ehub-app
    - export PUBLICPATH=/home/REPLACE_USERNAME/public_html
    - export NODE=/opt/cpanel/ea-nodejs20/bin/npm
    - /bin/rm -rf $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R . $DEPLOYPATH
    - cd $DEPLOYPATH
    - $NODE install
    - $NODE run build:cpanel
    - /bin/rm -rf $PUBLICPATH/*
    - /bin/cp -R $DEPLOYPATH/dist/* $PUBLICPATH/
    - /bin/cp $DEPLOYPATH/.htaccess $PUBLICPATH/ 2>/dev/null || true
